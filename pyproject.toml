[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rata-tools"
version = "0.2.0"
description = "Role-Aware Transportability Audit primitives for transcriptomic signatures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jiakang Zhao", email = "213231036@seu.edu.cn" }
]
keywords = [
  "transportability",
  "reproducibility",
  "transcriptomics",
  "external validation",
  "biomarker audit"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
docs = ["sphinx>=7"]

[project.scripts]
rata-tools = "rata_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

